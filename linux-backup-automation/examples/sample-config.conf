# Backup Configuration Example
# Source directories (space-separated)
SOURCE_DIRS="/home/user/documents /var/log/application /opt/data"

# Backup destination
BACKUP_DEST="/backup/archive"

# Retention policy (days)
RETENTION_DAYS=30

# Compression level (1-9, 9 = max compression)
COMPRESSION_LEVEL=6

# Email notifications
NOTIFY_EMAIL="admin@company.com"
NOTIFY_ON_SUCCESS=true
NOTIFY_ON_FAILURE=true